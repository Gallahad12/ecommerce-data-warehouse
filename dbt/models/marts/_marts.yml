version: 2

models:
  - name: dim_customers
    description: One row per real customer, keyed on customer_unique_id.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]

  - name: dim_products
    description: Products with English category names.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: category_name
        data_tests: [not_null]

  - name: dim_sellers
    columns:
      - name: seller_key
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension covering the dataset period.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_order_items
    description: Sales fact table. Grain is one row per item in an order.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_orders
    description: Order fact table. Grain is one row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
