name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "dbt-core~=1.12.0" dbt-duckdb duckdb -r requirements-gx.txt

      - name: Check Python syntax
        run: python -m py_compile dags/olist_warehouse.py scripts/load_raw.py scripts/load_sample_duckdb.py scripts/validate_raw.py

      - name: Load sample data
        run: python scripts/load_sample_duckdb.py

      - name: Validate raw data
        run: python scripts/validate_raw.py --target sample

      - name: Build and test models
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --target ci --profiles-dir .
